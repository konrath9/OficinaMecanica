# Secret de demonstracao local. Os valores abaixo devem bater com as credenciais
# provisionadas pelo Terraform em /infra (kubernetes_secret.postgres_credentials).
# Em um ambiente real, estes valores nunca seriam versionados em texto plano.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-mecanica-api-secrets
  namespace: oficina-mecanica
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=oficina_mecanica;Username=postgres;Password=postgres"
  Jwt__SecretKey: "OficinaMecanica@SecretKey#2024!MustBe32CharsMin"
