# Sistema completo da Fase 4 (3 microsservicos + RabbitMQ + 2x Postgres + MongoDB + Mailpit).
# Os repositorios do Billing e do Execution precisam estar clonados ao lado deste
# (ou aponte BILLING_PATH / EXECUTION_PATH para eles).
services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina_mecanica_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_mecanica
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-billing:
    image: postgres:16-alpine
    container_name: oficina_billing_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_billing
    ports:
      - "5434:5432"
    volumes:
      - billing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: oficina_execucao_mongo
    restart: always
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oficina_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: oficina
      RABBITMQ_DEFAULT_PASS: oficina123
    ports:
      - "5672:5672"
      - "15672:15672" # UI de gestao (oficina / oficina123)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: oficina_mecanica_mailpit
    restart: always
    ports:
      - "8025:8025" # UI web
      - "1025:1025" # SMTP

  api:
    build:
      context: .
      dockerfile: OficinaMecanica.API/Dockerfile
    container_name: oficina_mecanica_api
    restart: always
    ports:
      - "5000:8080"
    environment: &comum
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=oficina_mecanica;Username=postgres;Password=postgres"
      Jwt__SecretKey: "OficinaMecanica@SecretKey#2024!MustBe32CharsMin"
      Jwt__Issuer: "OficinaMecanicaAPI"
      Jwt__Audience: "OficinaMecanicaClients"
      Jwt__ExpiracaoHoras: "24"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: oficina
      RabbitMq__Password: oficina123
      Email__Host: "mailpit"
      Email__Port: "1025"
      Email__RemetenteEmail: "naoresponda@oficinamecanica.com.br"
      Email__RemetenteNome: "Oficina Mecânica"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  billing-api:
    build:
      context: ${BILLING_PATH:-../../oficina-billing-service}
    container_name: oficina_billing_api
    restart: always
    ports:
      - "5001:8080"
    environment:
      <<: *comum
      ConnectionStrings__DefaultConnection: "Host=postgres-billing;Port=5432;Database=oficina_billing;Username=postgres;Password=postgres"
      MercadoPago__AccessToken: "${MERCADO_PAGO_ACCESS_TOKEN:-}" # vazio = gateway fake
      MercadoPago__NotificationUrl: "${MERCADO_PAGO_NOTIFICATION_URL:-}"
    depends_on:
      postgres-billing:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  execution-api:
    build:
      context: ${EXECUTION_PATH:-../../oficina-execution-service}
    container_name: oficina_execution_api
    restart: always
    ports:
      - "5002:8080"
    environment:
      <<: *comum
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__Database: oficina_execucao
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  billing_postgres_data:
  mongo_data:
