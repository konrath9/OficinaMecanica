# Roteamento externo via Traefik (API Gateway bundled no k3s do repo oficina-mecanica-infra-k8s).
# Nao ha TLS/dominio proprio neste projeto academico - Traefik expoe a API em HTTP na entrypoint
# "web" (porta 80) do node. A autenticacao/autorizacao (JWT via CPF ou login administrativo)
# continua sendo aplicada pela propria API - o gateway aqui cuida apenas de roteamento.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-mecanica-api
  namespace: oficina-mecanica
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oficina-mecanica-api
                port:
                  number: 8080
