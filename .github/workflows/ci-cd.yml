name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/oficinamecanica-api
  KIND_CLUSTER_NAME: oficina-mecanica

jobs:
  build-test:
    name: Build, testes (unit + integracao + BDD) e cobertura >= 80%
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Testes automatizados com gate de cobertura (falha abaixo de 80% de linhas)
        run: >
          dotnet test OficinaMecanica.Tests --no-build -c Release --verbosity normal
          -p:CollectCoverage=true -p:CoverletOutputFormat=opencover
          -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=Total
          "-p:ExcludeByFile=**/Migrations/*.cs"
          -p:CoverletOutput=../TestResults/coverage/

      - name: Publicar relatorio de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-opencover
          path: TestResults/coverage/

  deploy-homologacao:
    name: Imagem + deploy no cluster kind efemero (homologacao)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write # unico job que publica imagem no GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build da imagem Docker (uso local, para carregar no cluster de CI)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: OficinaMecanica.API/Dockerfile
          tags: oficina-mecanica-api:ci
          load: true
          push: false

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: OficinaMecanica.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Instalar kind CLI
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Terraform apply (cluster kind efemero + banco de dados)
        id: tf_apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Exportar KUBECONFIG
        working-directory: infra
        run: echo "KUBECONFIG=$(terraform output -raw kubeconfig_path)" >> "$GITHUB_ENV"

      - name: Carregar imagem no cluster kind
        run: |
          # "failed to detect containerd snapshotter" e uma corrida conhecida do kind logo
          # apos a criacao do cluster (o node reporta Ready antes do containerd estar
          # totalmente pronto para consultas via ctr) - repete com backoff curto.
          for i in 1 2 3 4 5; do
            if kind load docker-image oficina-mecanica-api:ci --name "$KIND_CLUSTER_NAME"; then
              exit 0
            fi
            echo "Tentativa $i de carregar a imagem falhou, aguardando containerd ficar pronto..."
            sleep 10
          done
          echo "Falha ao carregar a imagem no cluster apos 5 tentativas"
          exit 1

      - name: Apontar manifesto para a imagem carregada localmente (somente nesta execucao de CI)
        run: sed -i "s|${{ env.IMAGE_NAME }}:.*|oficina-mecanica-api:ci|" k8s/deployment.yaml

      - name: Subir o RabbitMQ antes da API (o /health depende do broker)
        run: |
          kubectl apply -f k8s/rabbitmq.yaml
          kubectl rollout status deployment/rabbitmq -n oficina-mecanica --timeout=180s

      - name: Aplicar manifestos Kubernetes
        run: kubectl apply -f k8s/

      - name: Aguardar rollout dos deployments
        run: |
          kubectl rollout status deployment/oficina-mecanica-api -n oficina-mecanica --timeout=180s
          kubectl rollout status deployment/mailpit -n oficina-mecanica --timeout=120s

      - name: Smoke test da API
        run: |
          kubectl port-forward svc/oficina-mecanica-api 8080:8080 -n oficina-mecanica &
          sleep 5
          curl -sf http://localhost:8080/swagger/v1/swagger.json > /dev/null
          curl -sf http://localhost:8080/health

      - name: Terraform destroy (desprovisiona o cluster efemero de CI)
        if: always() && steps.tf_apply.conclusion != 'skipped'
        working-directory: infra
        run: terraform destroy -auto-approve

  deploy-producao:
    name: Deploy no cluster k3s de producao
    runs-on: ubuntu-latest
    needs: deploy-homologacao
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    env:
      K3S_HOST: ${{ secrets.K3S_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Configurar chave SSH do node k3s
        env:
          K3S_SSH_PRIVATE_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$K3S_SSH_PRIVATE_KEY" > ~/.ssh/k3s_ec2_key
          chmod 600 ~/.ssh/k3s_ec2_key
          ssh-keyscan -H "$K3S_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apontar manifesto para a imagem publicada no GHCR
        run: sed -i "s|${{ env.IMAGE_NAME }}:.*|${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s/deployment.yaml

      - name: Senha real do RabbitMQ no manifesto do broker
        env:
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: sed -i "s|oficina123|$RABBITMQ_PASSWORD|" k8s/rabbitmq.yaml

      - name: Gerar Secret de producao (RDS real + JWT + RabbitMQ) - k8s/secret.yaml e so o valor de demo/local
        env:
          PROD_DB_CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}
          PROD_JWT_SECRET_KEY: ${{ secrets.PROD_JWT_SECRET_KEY }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          kubectl create secret generic oficina-mecanica-api-secrets \
            --namespace oficina-mecanica \
            --from-literal=ConnectionStrings__DefaultConnection="$PROD_DB_CONNECTION_STRING" \
            --from-literal=Jwt__SecretKey="$PROD_JWT_SECRET_KEY" \
            --from-literal=RabbitMq__Password="$RABBITMQ_PASSWORD" \
            --from-literal=NewRelic__LicenseKey="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml > /tmp/prod-secret.yaml

      - name: Copiar manifestos (exceto o secret de demo) e o secret de producao para o node k3s
        run: |
          ssh -i ~/.ssh/k3s_ec2_key "ubuntu@$K3S_HOST" "rm -rf /tmp/oficina-mecanica-k8s && mkdir -p /tmp/oficina-mecanica-k8s"
          scp -i ~/.ssh/k3s_ec2_key $(ls k8s/*.yaml | grep -v '/secret\.yaml$') "ubuntu@$K3S_HOST":/tmp/oficina-mecanica-k8s/
          scp -i ~/.ssh/k3s_ec2_key /tmp/prod-secret.yaml "ubuntu@$K3S_HOST":/tmp/oficina-mecanica-k8s/secret.yaml

      - name: Aplicar manifestos no k3s e aguardar rollout
        run: |
          ssh -i ~/.ssh/k3s_ec2_key "ubuntu@$K3S_HOST" '
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl create namespace oficina-mecanica --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f /tmp/oficina-mecanica-k8s/rabbitmq.yaml
            kubectl rollout status deployment/rabbitmq -n oficina-mecanica --timeout=180s
            kubectl apply -f /tmp/oficina-mecanica-k8s/
            kubectl rollout status deployment/oficina-mecanica-api -n oficina-mecanica --timeout=180s
            kubectl rollout status deployment/mailpit -n oficina-mecanica --timeout=120s
          '

      - name: Smoke test via API Gateway (Traefik)
        # HTTP sem TLS: ambiente academico sem dominio/certificado (Sonar S5332 aceito como Safe)
        run: curl -sf --retry 6 --retry-delay 10 "http://$K3S_HOST/swagger/v1/swagger.json" > /dev/null
